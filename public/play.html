<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Play</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
        }

        iframe {
            display: block;
            height: 100%;
            border: 0;
        }

        body[data-count="1"] iframe {
            width: 100%;
        }

        body[data-count="2"] iframe {
            width: 50%;
        }

        .control {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <script src="/play.js"></script>
    <script>
        function toggleFullscreen() {
            const iframe = document.querySelector('iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
        }
    </script>
    <div class="control"><a href="/1">-</a> <a href="/2">+</a> <button onclick="toggleFullscreen()"
            type="button">fullscreen</button>
    </div>
</body>

</html>
