<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Play</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
        }

        iframe {
            display: block;
            height: 100%;
            border: 0;
        }

        body[data-count="1"] iframe {
            width: 100%;
        }

        body[data-count="2"] iframe {
            width: 50%;
        }

        body[data-count="3"] iframe {
            width: 33.333%;
        }
    </style>
</head>

<body>
    <script src="/play.js"></script>
</body>

</html>
