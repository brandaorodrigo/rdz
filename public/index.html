<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="dark" name="color-scheme">
    <title>rdz</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #121418;
            color: #f2f4f7;
            font-family: "Readex Pro", sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: min(100%, 22rem);
            padding: 1.5rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        a {
            display: block;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            background: #1c2026;
            color: inherit;
            text-decoration: none;
            text-align: center;
        }

        a:hover,
        a:focus-visible {
            background: #2a2e36;
        }
    </style>
</head>

<body>
    <main>
        <h1>rdz</h1>
        <a download="rdz.exe" href="/rdz.exe">Baixar rdz</a>
        <a href="/1">Assistir 1 canal</a>

</html>
